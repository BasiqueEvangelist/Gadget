pluginManagement {
    resolutionStrategy {
        eachPlugin {
            // new-id marker may 404; the descriptor lives inside the loom jar
            if (requested.id.id == "net.fabricmc.fabric-loom") {
                useModule("net.fabricmc:fabric-loom:" + requested.version)
            }
        }
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "gadget"